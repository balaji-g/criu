syntax = "proto2";

import "opts.proto";

/*
 * io_uring checkpoint/restore support
 *
 * io_uring is Linux's modern async I/O interface using shared ring buffers.
 * We need to save the ring configuration and state to restore it later.
 */

message io_uring_file_entry {
	required uint32 id		= 1;	/* File descriptor number */
	required uint64 ino		= 2;	/* Inode number (unique per ring) */
}

/* VMA mapping for io_uring - stores individual mmap() regions */
message io_uring_vma {
	required uint64 addr		= 1 [(criu).hex = true];	/* VMA start address */
	required uint64 size		= 2;				/* VMA size in bytes */
	required uint64 pgoff		= 3 [(criu).hex = true];	/* Page offset (determines type) */
	/* pgoff = 0x0        -> SQ/CQ ring (IORING_OFF_SQ_RING / IORING_OFF_CQ_RING) */
	/* pgoff = 0x8000000  -> CQ ring only (IORING_OFF_CQ_RING, if separate) */
	/* pgoff = 0x10000000 -> SQEs (IORING_OFF_SQES) */
}

/* Epoll registration that monitors this io_uring fd */
message io_uring_epoll_info {
	required uint32 epoll_id	= 1;	/* Epoll file_desc id (0x0000a1, etc) */
	required uint32 epoll_fd	= 2;	/* Epoll fd number */
	required uint32 events		= 3;	/* epoll events mask */
	required uint64 data		= 4;	/* epoll data (user pointer) */
}

message io_uring_entry {
	required uint32 id		= 1;	/* File descriptor number */
	required uint64 ino		= 2;	/* Inode number */

	/* Ring configuration (from io_uring_setup) */
	required uint32 sq_entries	= 3;	/* Number of SQ entries */
	required uint32 cq_entries	= 4;	/* Number of CQ entries */
	required uint32 flags		= 5;	/* Setup flags */

	/* SQ thread configuration */
	optional int32 sq_thread_cpu	= 6;	/* CPU for SQ thread (-1 if none) */
	optional uint32 sq_thread_idle	= 7;	/* SQ thread idle timeout */

	/* Ring state at checkpoint time */
	required uint32 sq_mask		= 10;	/* SQ ring mask */
	required uint32 sq_head		= 11;	/* SQ head position */
	required uint32 sq_tail		= 12;	/* SQ tail position */
	required uint32 cached_sq_head	= 13;	/* Cached SQ head */

	required uint32 cq_mask		= 20;	/* CQ ring mask */
	required uint32 cq_head		= 21;	/* CQ head position */
	required uint32 cq_tail		= 22;	/* CQ tail position */
	required uint32 cached_cq_tail	= 23;	/* Cached CQ tail */

	/* Pending entries (should be 0 for clean checkpoint) */
	required uint32 sqes		= 30;	/* Pending SQEs */
	required uint32 cqes		= 31;	/* Pending CQEs */

	/* Memory mapping addresses (legacy single-VMA, kept for compatibility) */
	required uint64 sq_ring_addr	= 40 [(criu).hex = true];
	required uint64 cq_ring_addr	= 41 [(criu).hex = true];
	required uint64 sqe_addr	= 42 [(criu).hex = true];

	required uint64 sq_ring_size	= 43;
	required uint64 cq_ring_size	= 44;
	required uint64 sqe_size	= 45;

	/* Multiple VMA mappings (uvloop creates multiple mmap()s on same ring fd) */
	repeated io_uring_vma vmas	= 60;

	/* Epoll registrations monitoring this io_uring fd */
	/* CRITICAL: These must be restored AFTER io_uring_setup() to fix ordering issue */
	repeated io_uring_epoll_info epoll_refs	= 61;

	/* Registered resources */
	optional uint32 user_files	= 50;	/* Number of registered files */
	optional uint32 user_bufs	= 51;	/* Number of registered buffers */

	/* Kernel-returned offsets (from io_uring_params after setup) */
	/* CRITICAL: These must match between dump and restore for uvloop to work */
	/* sq_off: offsets within SQ ring mmap */
	optional uint32 sq_off_head		= 70;
	optional uint32 sq_off_tail		= 71;
	optional uint32 sq_off_ring_mask	= 72;
	optional uint32 sq_off_ring_entries	= 73;
	optional uint32 sq_off_flags		= 74;
	optional uint32 sq_off_dropped		= 75;
	optional uint32 sq_off_array		= 76;
	/* cq_off: offsets within CQ ring mmap */
	optional uint32 cq_off_head		= 80;
	optional uint32 cq_off_tail		= 81;
	optional uint32 cq_off_ring_mask	= 82;
	optional uint32 cq_off_ring_entries	= 83;
	optional uint32 cq_off_overflow		= 84;
	optional uint32 cq_off_cqes		= 85;
	optional uint32 cq_off_flags		= 86;
	/* Kernel features */
	optional uint32 features		= 90;
}

